name: Request state regressions

on:
  push:
    paths:
      - .claude/skills/ppt-master/scripts/presentation_request.py
      - .claude/skills/ppt-master/scripts/presentation_request_state.py
      - tests/**
      - .github/workflows/request-state-regression.yml
  pull_request:
    paths:
      - .claude/skills/ppt-master/scripts/presentation_request.py
      - .claude/skills/ppt-master/scripts/presentation_request_state.py
      - tests/**
      - .github/workflows/request-state-regression.yml

permissions:
  contents: read

jobs:
  selection-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run synthetic request selection regressions
        run: python3 -m unittest discover -s tests -v
