<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="business-example" data-pptx-master-name="Korean Business Example" data-pptx-layout="business-content" data-pptx-layout-name="Business Content" data-business-page-type="roadmap">
