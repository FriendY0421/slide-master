<g id="phase-one"><text x="72" y="258" font-family="Pretendard" font-size="22" font-weight="700" fill="#1E4D8F" data-business-role="label" data-business-width="340">1–2주</text><text x="72" y="372" font-family="Pretendard" font-size="28" font-weight="700" fill="#172033" data-business-role="heading" data-business-width="340">진단 기준 정비</text><text x="72" y="438" font-family="Pretendard" font-size="28" fill="#172033" data-business-role="body" data-business-width="340">점검 항목을 통일</text><text x="72" y="528" font-family="Pretendard" font-size="22" fill="#526079" data-business-role="label" data-business-width="340">산출물: 진단 체크리스트</text></g>
<g id="phase-two"><text x="462" y="258" font-family="Pretendard" font-size="22" font-weight="700" fill="#167F8D" data-business-role="label" data-business-width="340">3–6주</text><text x="462" y="372" font-family="Pretendard" font-size="28" font-weight="700" fill="#172033" data-business-role="heading" data-business-width="340">두 팀에서 시범 운영</text><text x="462" y="438" font-family="Pretendard" font-size="28" fill="#172033" data-business-role="body" data-business-width="340">핵심 부품 사전 확보</text><text x="462" y="528" font-family="Pretendard" font-size="22" fill="#526079" data-business-role="label" data-business-width="340">판단: 최초 해결률 개선</text></g>
